---
apiVersion: v1
kind: Service
metadata:
  name: voice-enroll-svc
spec:
  # ClusterIP only. The internal resolve port (8082) has NO HTTPRoute and is
  # never publicly reachable by construction — same pattern as voice-bridge's
  # internal captures port.
  selector:
    app.kubernetes.io/name: voice-enroll
  ports:
  - name: public
    port: 8080
    targetPort: 8080
  - name: internal
    port: 8082
    targetPort: 8082
